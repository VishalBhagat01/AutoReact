version: '3.8'

services:
  # Python FastAPI AI Microservice
  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: reagmat-ai-service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - LOG_LEVEL=info
      - SERVICE_SECRET=reagmat_internal_production_secret
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - reagmat-network

  # Node.js Express Backend Gateway
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reagmat-backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/reagmat
      - PYTHON_SERVICE_URL=http://agent:8000
      - PYTHON_SERVICE_SECRET=reagmat_internal_production_secret
      - ASSET_STORAGE_DIR=/app/storage/assets
    depends_on:
      - agent
      - mongo
    volumes:
      - backend-assets:/app/storage/assets
    restart: unless-stopped
    networks:
      - reagmat-network

  # MongoDB Persistence Store
  mongo:
    image: mongo:7.0
    container_name: reagmat-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - reagmat-network

networks:
  reagmat-network:
    driver: bridge

volumes:
  mongo-data:
  backend-assets:
